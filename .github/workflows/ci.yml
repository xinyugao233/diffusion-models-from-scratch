name: CPU checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU PyTorch
        run: >-
          python -m pip install torch==2.15.0 torchvision==0.29.2
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and development dependencies
        run: python -m pip install -c constraints-review.txt -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run CPU tests
        run: pytest -q
      - name: Installed public CPU demo (README entry point)
        env:
          DEMO_OUTPUT: ${{ runner.temp }}/diffusion-demo
        run: python scripts/run_synthetic_optimization.py --config configs/public_cpu_demo.json --output-dir "${DEMO_OUTPUT:-outputs/cpu-demo}"
